<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./scripts/main.js" defer></script>
    <script src="./scripts/transition.js" defer></script>
    <link rel="stylesheet" href="./jeu.css" />
    <link rel="stylesheet" href="./commun.css" />
    <title>Recentrer</title>
</head>
<body>
    <!-- overlay video decoratif -->
    <div class="overlay">
        <video src="./images/overlay.mp4" autoplay muted loop></video>
    </div>
    <!-- niveau de zoom, pour déboguer (caché dans le css) -->
    <p id="zoom-info">Zoom : 0</p>

    <!-- échelle d'altitude à gauche -->
    <div id="echelle">
      <div id="echelle-barre">
        <div id="echelle-curseur"><span id="echelle-altitude"></span></div>
      </div>
    </div>

    <!-- filtre qui courbe le sol, le js crée la carte et règle la force -->
    <svg width="0" height="0" style="position: absolute">
      <!-- height 1.5 pour que le sol courbé ne soit pas coupé en bas -->
      <filter id="courbure" x="0" y="0" width="1" height="1.5" color-interpolation-filters="sRGB">
        <feImage id="courbure-carte" preserveAspectRatio="none" result="carte" />
        <feDisplacementMap id="courbure-force" in="SourceGraphic" in2="carte" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <!-- les couches, de la plus loin à la plus proche -->
    <div id="scene">
      <div id="couche-etoiles" class="couche etoiles"></div>
      <div id="couche-planete" class="couche"></div>
      <div id="couche-sol" class="couche"></div>
    </div>
  </body>
  
<!-- pour le cercle autour du curseur -->
<div class="cursor-circle"></div>

<script>
    // Récupère le cercle créé juste au-dessus
    const cursorCircle = document.querySelector(".cursor-circle");

    // Position de la souris    
    let mouseX = 0;
    let mouseY = 0;

    let circleX = 0;
    let circleY = 0;
    // "écoute" les déplacements de la souris
    document.addEventListener("mousemove", (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
    });

    function animateCursor() {
        // mouvement fluide avec un léger retard
        circleX += (mouseX - circleX) * 0.12;
        circleY += (mouseY - circleY) * 0.12;

        cursorCircle.style.left = circleX + "px";
        cursorCircle.style.top = circleY + "px";
        
        requestAnimationFrame(animateCursor);
    }
    // Demande de relancer cette fonction à la prochaine image affichée
    animateCursor();
</script>
</html>
